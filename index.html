    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
            overflow-x: hidden;
            background:
                radial-gradient(circle at 20% 20%, #392064, transparent 35%),
                radial-gradient(circle at 80% 30%, #153d7a, transparent 35%),
                #050510;
        }

        /* STARS */

        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite alternate;
        }

        @keyframes twinkle {
            from {
                opacity: 0.2;
                transform: scale(1);
            }

            to {
                opacity: 1;
                transform: scale(1.8);
            }
        }

        /* PLANETS */

        .planet-stage {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .planet {
            position: absolute;
            width: clamp(70px, 11vw, 135px);
            aspect-ratio: 1;
            border-radius: 50%;
            opacity: 0;
            background: var(--planet);

            box-shadow:
                0 0 30px var(--glow),
                inset -18px -12px 25px rgba(0, 0, 0, 0.5);

            animation: planetTravel 40s linear infinite;
            animation-delay: var(--delay);
        }

        .mercury {
            --delay: 0s;
            --planet: radial-gradient(circle at 30% 30%, #eee, #888 55%, #333);
            --glow: rgba(200, 200, 200, 0.6);
        }

        .venus {
            --delay: 5s;
            --planet: radial-gradient(circle at 30% 30%, #fff0b0, #d6a052 50%, #754326);
            --glow: rgba(255, 190, 100, 0.6);
        }

        .earth {
            --delay: 10s;
            --planet: radial-gradient(circle at 30% 30%, #a7f3d0, #2387db 45%, #10204d);
            --glow: rgba(60, 150, 255, 0.7);
        }

        .mars {
            --delay: 15s;
            --planet: radial-gradient(circle at 30% 30%, #ffc0a0, #d44b32 50%, #651b18);
            --glow: rgba(255, 90, 60, 0.6);
        }

        .jupiter {
            --delay: 20s;
            --planet: repeating-linear-gradient(
                0deg,
                #b9784e 0px,
                #f2d0a0 10px,
                #a95e3b 18px,
                #e7bd86 26px
            );
            --glow: rgba(235, 160, 100, 0.6);
        }

        .saturn {
            --delay: 25s;
            --planet: radial-gradient(circle at 30% 30%, #ffe9a6, #c69a54 55%, #65482d);
            --glow: rgba(255, 210, 120, 0.6);
        }

        .saturn::after {
            content: "";
            position: absolute;
            width: 155%;
            height: 35%;
            top: 33%;
            left: -28%;
            border: 6px solid rgba(245, 215, 160, 0.8);
            border-radius: 50%;
            transform: rotate(-20deg);
        }

        .uranus {
            --delay: 30s;
            --planet: radial-gradient(circle at 30% 30%, #d6ffff, #68d4dc 50%, #226b91);
            --glow: rgba(90, 230, 240, 0.6);
        }

        .neptune {
            --delay: 35s;
            --planet: radial-gradient(circle at 30% 30%, #a5baff, #3559e8 50%, #111b69);
            --glow: rgba(80, 100, 255, 0.7);
        }

        @keyframes planetTravel {
            0% {
                left: -15%;
                top: 8%;
                opacity: 0;
                transform: scale(0.6) rotate(0deg);
            }

            10% {
                opacity: 0.55;
            }

            30% {
                left: 25%;
                top: 72%;
                opacity: 0.5;
                transform: scale(1) rotate(100deg);
            }

            55% {
                left: 60%;
                top: 12%;
                opacity: 0.5;
                transform: scale(0.85) rotate(220deg);
            }

            80% {
                left: 88%;
                top: 65%;
                opacity: 0.45;
                transform: scale(1.1) rotate(300deg);
            }

            92% {
                opacity: 0;
            }

            100% {
                left: 110%;
                top: 30%;
                opacity: 0;
                transform: scale(0.6) rotate(360deg);
            }
        }

        /* SHOOTING STAR */

        .shooting-star {
            position: fixed;
            width: 120px;
            height: 2px;
            top: 10%;
            left: -150px;
            background: linear-gradient(90deg, transparent, white);
            transform: rotate(-35deg);
            animation: shooting 8s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes shooting {
            0% {
                left: -150px;
                top: 10%;
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            50% {
                left: 110%;
                top: 60%;
                opacity: 0;
            }

            100% {
                left: 110%;
                opacity: 0;
            }
        }

        /* CONTENT */

        header,
        main,
        footer {
            position: relative;
            z-index: 1;
        }

        header {
            padding: 30px 15px;
            background: rgba(0, 0, 0, 0.38);
            backdrop-filter: blur(4px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);

        header h1 {
            margin: 0;
            font-size: 45px;
            text-shadow: 0 0 18px #8b5cf6;
        }

        header p {
            color: #d5d2ef;

        .box {

            margin: 65px auto;
            padding: 45px;
            background: rgba(15, 15, 32, 0.76);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);

            box-shadow: 0 0 45px rgba(110, 70, 255, 0.3);

        .box > p {
            font-size: 18px;
            line-height: 1.6;

            margin: 18px 0;
            border-radius: 12px;
            border: 1px solid #555070;
            background: #111126;
            color: white;
            font-size: 18px;
        }

        input:focus {
            outline: none;
            border-color: #9b5cff;
            box-shadow: 0 0 15px #7c3aed;
        }

        input::placeholder {
            color: #aaaad0;
        }

        button {
            padding: 17px 32px;
            border: none;
            border-radius: 35px;
            cursor: pointer;
            color: white;
            font-size: 18px;
            background: linear-gradient(90deg, #6d28d9, #2563eb);
            box-shadow: 0 0 22px rgba(100, 80, 255, 0.4);
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 32px rgba(120, 90, 255, 0.7);
        }

        /* SIGN RESULTS */

        #result {
            margin-top: 35px;
        }

            display: flex;
            gap: 22px;
            justify-content: center;
            align-items: stretch;
            margin-top: 30px;

            padding: 30px 15px;
            border-radius: 23px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 25px rgba(100, 70, 255, 0.2);
            transition: 0.3s;
        }

        .sign-card:hover {
            transform: translateY(-7px);
            box-shadow: 0 0 35px rgba(130, 90, 255, 0.45);
        }

        .western-card {
            border-top: 4px solid #9b5cff;
        }

        .vedic-card {
            border-top: 4px solid #ffb300;
        }

        .sign-title {
            font-size: 20px;
            font-weight: bold;
            color: #c4b5fd;
            line-height: 1.4;
        }

        .vedic-card .sign-title {
            color: #ffd34e;
        }

        .sign-symbol {

            animation: floating 3s ease-in-out infinite;
            text-shadow: 0 0 25px #a78bfa;
        }

        .vedic-card .sign-symbol {
            text-shadow: 0 0 25px #f59e0b;
        }

        .sign-name {
            font-size: 28px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        @keyframes floating {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        /* INFORMATION */

        .info {
            margin-top: 30px;
            padding: 25px;
            text-align: left;
            line-height: 2;
            font-size: 19px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 20px;
        }

        .info b {
            color: #c4b5fd;
        }

        .info-columns {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .info-column {
            min-width: 0;
            padding: 16px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .info-line {
            margin-bottom: 12px;
            min-width: 0;
            text-align: center;
        }

        .info-column .info-line > b {
            display: inline-block;
            margin-bottom: 4px;
        }

        .birthstone-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
            width: 100%;
            max-width: 100%;
            margin: 8px auto 0;
            text-align: center;
        }

        .birthstone-name {
            display: block;
            width: 100%;
            font-weight: bold;
            overflow-wrap: anywhere;
            text-align: center;
        }

        .info-birthstone-photo {
            display: block;
            width: 150px;
            max-width: 100%;
            height: 105px;
            object-fit: cover;
            object-position: center;
            align-self: center;
            margin: 0 auto 4px;
            border-radius: 7px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 10px rgba(167, 139, 250, 0.35);
        }

        /* FOOTER */

        footer {
            margin-top: 70px;
            padding: 25px;
            color: #aaa;
            background: rgba(0, 0, 0, 0.4);
        }

        /* MOBILE */

        @media (max-width: 600px) {
            header h1 {
                font-size: 34px;
            }

            header p {
                font-size: 15px;
            }

            .box {
                padding: 28px 18px;
                margin: 40px auto;
            }

            .box h2 {
                font-size: 27px;
            }

            .box > p {
                font-size: 16px;
            }

            .sign-container {
                gap: 12px;
            }

            .sign-card {
                min-height: 215px;
                padding: 20px 8px;
            }

            .sign-title {
                font-size: 13px;
            }

            .sign-symbol {
                font-size: 62px;
            }

            .sign-name {
                font-size: 19px;
            }

            .info {
                font-size: 16px;
                padding: 18px;
            }

            .info-columns {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .info-birthstone-photo {
                width: 135px;
                height: 95px;
            }

            .planet {
                width: 65px;
            }
        }

        /* ACCESSIBILITY */

        @media (prefers-reduced-motion: reduce) {
            .star,
            .planet,
            .shooting-star,
            .sign-symbol {
                animation: none;
            }

            .planet {
                opacity: 0.2;
            }
        }
    </style>
</head>

        const stars = document.getElementById("stars");

        function getStoneImage(stone) {
            const images = {
                /*
                  As requested:
                  Diamond name -> Aquamarine photo
                  Aquamarine name -> Diamond photo
                */
                Diamond: "https://upload.wikimedia.org/wikipedia/commons/3/36/Aquamarine_%28GeoDIL_number_-_2731%29.jpg",
                Aquamarine: "https://upload.wikimedia.org/wikipedia/commons/d/d1/Diamond-214884.jpg",

                Garnet: "https://loremflickr.com/240/180/garnet,gemstone",
                Amethyst: "https://loremflickr.com/240/180/amethyst,gemstone"
            };

            return images[stone] ||
                "https://placehold.co/240x180/17152d/ffffff?text=Birthstone";
        }

        /* FIND ZODIAC */

        function findZodiac() {
            const dateText = document.getElementById("birthDate").value.trim();
            const result = document.getElementById("result");

            if (!dateText) {
                result.innerHTML =
                    "<p style='color:#ff8888'>⚠️ Please enter your date and month.</p>";
                return;
            }

            let parts = dateText.match(
                /^(\d{1,2})[\s/-]+([a-zA-Z]+|\d{1,2})$/
            );

            if (!parts) {
                parts = dateText.match(
                    /^([a-zA-Z]+)[\s/-]+(\d{1,2})$/
                );

                if (parts) {
                    parts = [parts[0], parts[2], parts[1]];
                }
            }

            if (!parts) {
                result.innerHTML =
                    "<p style='color:#ff8888'>⚠️ Enter like 5 October or 5/10.</p>";
                return;
            }

            const day = Number(parts[1]);
            const monthText = parts[2].toLowerCase();

            const monthNames = [
                "january", "february", "march", "april",
                "may", "june", "july", "august",
                "september", "october", "november", "december"
            ];

            let month = Number(monthText);

            if (Number.isNaN(month)) {
                month = monthNames.indexOf(monthText) + 1;

                if (month === 0) {
                    month = monthNames.findIndex(name =>
                        name.startsWith(monthText)
                    ) + 1;
                }
            }

            const daysInMonth = [
                31, 29, 31, 30, 31, 30,
                31, 31, 30, 31, 30, 31
            ];

            if (
                !Number.isInteger(day) ||
                day < 1 ||
                day > 31 ||
                !Number.isInteger(month) ||
                month < 1 ||
                month > 12 ||
                day > daysInMonth[month - 1]
            ) {
                result.innerHTML =
                    "<p style='color:#ff8888'>⚠️ Please enter a valid date and month.</p>";
                return;
            }

            /* WESTERN SUN SIGN */

            let sign, symbol, element, birthstone, description;

            if ((month === 3 && day >= 21) || (month === 4 && day <= 19)) {
                sign = "Aries";
                symbol = "♈";
                element = "Fire";
                birthstone = "Diamond";
                description = "Confident, energetic and courageous.";
            } else if ((month === 4 && day >= 20) || (month === 5 && day <= 20)) {
                sign = "Taurus";
                symbol = "♉";
                element = "Earth";
                birthstone = "Emerald";
                description = "Patient, reliable and hardworking.";
            } else if ((month === 5 && day >= 21) || (month === 6 && day <= 20)) {
                sign = "Gemini";

                element = "Air";
                birthstone = "Pearl";

                sign = "Virgo";

                element = "Earth";
                birthstone = "Sapphire";
                description = "Organized, practical and thoughtful.";
            } else if ((month === 9 && day >= 23) || (month === 10 && day <= 22)) {
                sign = "Libra";
                symbol = "♎";
                element = "Air";
                birthstone = "Opal";
                description = "Balanced, friendly and fair-minded.";
            } else if ((month === 10 && day >= 23) || (month === 11 && day <= 21)) {
                sign = "Scorpio";
                symbol = "♏";
                element = "Water";
                birthstone = "Topaz";
                description = "Determined, passionate and focused.";
            } else if ((month === 11 && day >= 22) || (month === 12 && day <= 21)) {
                sign = "Sagittarius";
                symbol = "♐";
                element = "Fire";
                birthstone = "Turquoise";
                description = "Adventurous, optimistic and curious.";
            } else if ((month === 12 && day >= 22) || (month === 1 && day <= 19)) {
                sign = "Capricorn";
                symbol = "♑";
                element = "Earth";
                birthstone = "Garnet";
                description = "Responsible, disciplined and ambitious.";
            } else if ((month === 1 && day >= 20) || (month === 2 && day <= 18)) {
                sign = "Aquarius";

                element = "Air";
                birthstone = "Amethyst";
                description = "Independent, creative and original.";
            } else {

            }

            /* VEDIC SUN SIGN - APPROXIMATE DATE RANGES */

            let vedicSign, vedicSymbol;

            if ((month === 4 && day >= 14) || (month === 5 && day <= 14)) {

            /* VEDIC ELEMENT AND BIRTHSTONE */

            const vedicDetails = {

            };

            const [vedicElement, vedicBirthstone] = vedicDetails[vedicSign];

            /* DISPLAY BOTH SIGNS SIDE BY SIDE */

            result.innerHTML = `
                <div class="sign-container">

                    <div class="sign-card western-card">

                        <div class="sign-title">🕉️ VEDIC SUN SIGN</div>
                        <div class="sign-symbol">${vedicSymbol}</div>
                        <div class="sign-name">${vedicSign}</div>
                    </div>

                </div>

                <div class="info">
                    <div class="info-columns">

                        <div class="info-column western-card">
                            <div class="info-line">
                                <b>🌍 Western Element:</b><br>
                                ${element}
                            </div>

                            <div class="info-line">
                                <b>💎 Western Birthstone:</b><br>

                                <div class="birthstone-display">
                                    <span class="birthstone-name">${birthstone}</span>

                                    <img
                                        class="info-birthstone-photo"
                                        src="${getStoneImage(birthstone)}"
                                        alt="${birthstone} birthstone photo"
                                        loading="lazy"
                                        onerror="this.onerror=null;this.src='https://placehold.co/240x180/17152d/ffffff?text=Birthstone';"
                                    >
                                </div>
                            </div>
                        </div>

                        <div class="info-column vedic-card">
                            <div class="info-line">
                                <b>🪔 Vedic Element:</b><br>
                                ${vedicElement}
                            </div>

                            <div class="info-line">
                                <b>💎 Vedic Birthstone:</b><br>

                                <div class="birthstone-display">
                                    <span class="birthstone-name">${vedicBirthstone}</span>

                                    <img
                                        class="info-birthstone-photo"
                                        src="${getStoneImage(vedicBirthstone)}"
                                        alt="${vedicBirthstone} birthstone photo"
                                        loading="lazy"
                                        onerror="this.onerror=null;this.src='https://placehold.co/240x180/17152d/ffffff?text=Birthstone';"
                                    >
                                </div>
                            </div>
                        </div>

                    </div>

                    <div style="margin-top:18px;">
                        <b>📝 Personality:</b>
                        ${description}
                    </div>

                    <p style="font-size:13px;color:#bbb;margin-top:12px;line-height:1.5;">
                        Note: Vedic sign dates and birthstones are approximate.
                        A traditional Vedic reading may require a full birth chart.
                    </p>
                </div>
            `;
        }

        /* ENTER KEY SUPPORT */

        document.getElementById("birthDate").addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                findZodiac();
            }
        });
    </script>

</body>
</html>
