<!DOCTYPE html>
<html>
<head>

    <title>Zodiac Universe</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            color: white;
            text-align: center;

            background:
                radial-gradient(circle at top, #302060, #080812 70%);
            min-height: 100vh;
        }

        header {
            padding: 30px;
            background: rgba(0,0,0,0.3);
        }

        header h1 {
            font-size: 42px;
            margin: 0;
        }

        header p {
            color: #bbb;
        }

        .box {
            width: 450px;
            max-width: 90%;

            margin: 70px auto;

            padding: 40px;

            background: rgba(255,255,255,0.08);

            border-radius: 25px;

            box-shadow: 0 0 40px rgba(100,80,255,0.25);
        }

        .box h2 {
            font-size: 28px;
        }

        input {
            width: 90%;

            padding: 15px;

            margin: 12px;

            border: none;

            border-radius: 10px;

            background: #15152b;

            color: white;

            font-size: 16px;
        }

        button {
            margin-top: 20px;

            padding: 15px 30px;

            border: none;

            border-radius: 30px;

            background: linear-gradient(
                90deg,
                #6c63ff,
                #a45cff
            );

            color: white;

            font-size: 17px;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
        }

        footer {
            margin-top: 80px;

            padding: 25px;

            background: rgba(0,0,0,0.4);

            color: #aaa;
        }

    </style>

</head>


<body>


<header>

    <h1>🌌 Zodiac Universe</h1>

    <p>
        Discover your Zodiac personality
    </p>

</header>


<div class="box">

    <h2>🔮 Discover Your Zodiac</h2>

    <p>
        Enter your information below
    </p>


    <input
        type="text"
        id="name"
        placeholder="Enter your name">


    <input
        type="date"
        id="birthDate">


    <button onclick="discoverZodiac()">

        ✨ Discover My Zodiac

    </button>


    <p id="error"></p>

</div>


<footer>

    <p>
        🌌 Zodiac Universe © 2026
    </p>

    <p>
        Astrology information is for entertainment.
    </p>

</footer>


<script>

function discoverZodiac() {

    var name =
        document.getElementById("name").value;

    var date =
        document.getElementById("birthDate").value;


    if (name == "" || date == "") {

        document.getElementById("error").innerHTML =
            "⚠️ Please enter your name and date of birth.";

        return;

    }


    localStorage.setItem("userName", name);

    localStorage.setItem("birthDate", date);


    window.location.href = "result.html";

}

</script>


</body>
</html>
